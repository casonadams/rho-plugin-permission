[package]
name = "rho-plugin-permission"
version = "0.1.3"
edition = "2024"
description = "Permission plugin for rho: allow/deny rules plus interactive approval"
license = "MIT"
repository = "https://github.com/casonadams/rho-plugin-permission"
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
async-trait = "0.1"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }
rho-plugin-sdk = "0.1.3"

# Local testing: prefill support in host/ui/input (input_with_default).
# Remove before publishing; requires rho-plugin-sdk with input_with_default on crates.io.
[patch.crates-io]
rho-plugin-sdk = { path = "../rho/crates/rho-plugin-sdk" }
